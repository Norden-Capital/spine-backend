name: Deploy
# Show the commit message (the CI run's title) instead of just "Deploy".
run-name: ${{ github.event.workflow_run.display_title }}

# Runs after the CI workflow finishes. We only deploy when CI passed on a
# push to main, so tests are never skipped and are not run twice.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

# Never run two deploys at the same time; a newer one waits for the older one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/norden-capital/spine-backend

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Get short sha
        id: vars
        run: echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.vars.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copy compose file to the server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          source: deploy/compose.prod.yaml
          target: /opt/spine
          strip_components: 1

      - name: Pull and start on the server
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ steps.vars.outputs.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          envs: IMAGE_TAG,GHCR_USER,GHCR_TOKEN
          command_timeout: 10m
          script: |
            set -eu
            cd /opt/spine
            export IMAGE_TAG

            # Short-lived login with this run's token, so the server needs no
            # stored GHCR password. Log out right after the pull.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            # Retry: a pull can fail on a short network error (connection reset).
            pulled=no
            for try in 1 2 3; do
              if docker compose -f compose.prod.yaml pull; then pulled=yes; break; fi
              echo "Pull failed (try $try of 3), retrying in 10s"
              sleep 10
            done
            docker logout ghcr.io
            [ "$pulled" = yes ] || { echo "Pull failed 3 times"; exit 1; }

            # --wait blocks until every service is healthy (the api healthcheck
            # calls /actuator/health/readiness) and fails the job if not.
            if ! docker compose -f compose.prod.yaml up -d --remove-orphans --wait --wait-timeout 180; then
              echo "Deploy failed: API is not healthy. Last logs:"
              docker compose -f compose.prod.yaml logs --tail 100 api
              exit 1
            fi
            docker compose -f compose.prod.yaml ps
            echo "Deployed $IMAGE_TAG"
