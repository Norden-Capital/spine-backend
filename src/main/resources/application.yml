# Default (local) configuration.
# Every value can be overridden with an environment variable (see .env.example).
spring:
  application:
    name: spine
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/spine}
    username: ${SPRING_DATASOURCE_USERNAME:spine}
    password: ${SPRING_DATASOURCE_PASSWORD:spine}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    # Sessions live in Postgres. Flyway creates the tables (V3), so never let Spring do it.
    jdbc:
      initialize-schema: never

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      # Log out after 8 hours without any request.
      timeout: 8h
      cookie:
        name: SESSION
        http-only: true
        same-site: lax
        path: /
        # Local runs on plain http. The prod profile sets this to true.
        secure: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# API docs and Swagger UI are off by default. Only the "local" profile turns them on.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  cors:
    # Comma-separated list. Patterns like https://*.vercel.app are allowed.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  # Links in emails point here (e.g. <frontend-url>/set-password?token=...).
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  mail:
    from: ${APP_MAIL_FROM:Spine <no-reply@localhost>}
    # Empty = emails are only printed to the console (local dev).
    resend-api-key: ${RESEND_API_KEY:}
    require-resend: false
  bootstrap:
    # On startup, if there is no user at all, this email is invited as the first ADMIN.
    admin-email: ${APP_BOOTSTRAP_ADMIN_EMAIL:admin@nordencapital.ca}
  auth:
    invite-ttl: 72h
    reset-ttl: 1h
    # Login: after this many failed tries for one email + IP, block it for the lock time.
    login-max-failures: 5
    login-lock-time: 15m
    # Forgot password: at most this many requests per email + IP in the window.
    forgot-password-max-requests: 3
    forgot-password-window: 15m

---
# Local development: ./mvnw spring-boot:run activates the "local" profile (see pom.xml).
# The "!prod" part keeps Swagger off even if both profiles are active.
spring:
  config:
    activate:
      on-profile: "local & !prod"
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    # "Try it out" sends the XSRF-TOKEN cookie back as the X-XSRF-TOKEN header.
    csrf:
      enabled: true
