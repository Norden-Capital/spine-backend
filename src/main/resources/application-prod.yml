# Production profile. Activate with SPRING_PROFILES_ACTIVE=prod.
# No defaults here on purpose: the app fails to start if a required variable is missing.
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  docker:
    compose:
      enabled: false

server:
  servlet:
    session:
      cookie:
        # The browser reaches the API over https (through the Vercel proxy).
        secure: true

management:
  endpoint:
    health:
      show-details: never

# API docs and Swagger UI must stay off in production. Never enable them here.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
  frontend-url: ${APP_FRONTEND_URL}
  mail:
    from: ${APP_MAIL_FROM}
    resend-api-key: ${RESEND_API_KEY}
    # Fail at startup instead of silently printing emails to the log.
    require-resend: true
  bootstrap:
    admin-email: ${APP_BOOTSTRAP_ADMIN_EMAIL}
  files:
    # Docker named volume "spine-files" is mounted at /app/data (see deploy/compose.prod.yaml).
    dir: /app/data/files
