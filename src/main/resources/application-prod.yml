# Production profile. Activate with SPRING_PROFILES_ACTIVE=prod.
# No defaults here on purpose: the app fails to start if a required variable is missing.
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  docker:
    compose:
      enabled: false

management:
  endpoint:
    health:
      show-details: never

# API docs and Swagger UI must stay off in production. Never enable them here.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
